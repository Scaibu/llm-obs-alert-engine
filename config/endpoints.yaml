api_version: "v1"
endpoints:
  health:
    base: "/healthz"
    port: 8001
  ready:
    base: "/readyz"
    port: 8001
  metrics:
    base: "/metrics"
    port: 9464
upstream_services:
  postgres:
    default_port: 5439
    timeout_seconds: 5
  redis:
    default_port: 6389
    timeout_seconds: 2
  kafka:
    default_port: 9099
    timeout_seconds: 10
