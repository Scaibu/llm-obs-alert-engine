server:
  host: "0.0.0.0"
  port: 8001
  health_check_port: 8001
  prometheus_metrics_port: 9464
  service_name: "alert-engine"

kafka:
  bootstrap_servers: "localhost:9099"
  consumer_group: "alert-engine-group"
  topics:
    - "alerts.budget"
    - "alerts.cost.anomaly"
    - "llm.toxicity.flagged"
    - "alerts.quality.degradation"
    - "alerts.latency.slo"
    - "alerts.latency.ttft_regression"

redis:
  url: "redis://localhost:6389/0"
  rate_limit_per_minute: 10

postgres:
  host: "localhost"
  port: 5439
  user: "postgres"
  password: "postgres"
  db: "ewma_db"
  pool_size: 10
  timeout_seconds: 5

integrations:
  slack_webhook_url: "http://localhost:8080/mock-slack"
  pagerduty_routing_key: "mock-pagerduty-routing-key"
  service_owners_file: "config/service_owners.yaml"
