server:
  host: "0.0.0.0"
  port: 8001
  health_check_port: 8001
  prometheus_metrics_port: 9464
  service_name: "alert-engine"

kafka:
  bootstrap_servers: "localhost:9099"
  consumer_group: "alert-engine-group"
  topics:
    - "alerts.budget"
    - "alerts.cost.anomaly"
    - "llm.toxicity.flagged"
    - "alerts.quality.degradation"
    - "alerts.latency.slo"
    - "alerts.latency.ttft_regression"

redis:
  url: "redis://localhost:6389/0"
  rate_limit_per_minute: 10

postgres:
  host: "localhost"
  port: 5439
  user: "postgres"
  password: "postgres"
  db: "ewma_db"
  pool_size: 10
  timeout_seconds: 5

integrations:
  slack_webhook_url: ""
  slack_timeout_seconds: 5.0
  pagerduty_routing_key: ""
  pagerduty_endpoint: ""
  pagerduty_timeout_seconds: 5.0
  teams_webhook_url: ""
  opsgenie_api_key: ""
  opsgenie_endpoint: ""
  generic_webhook_url: ""
  discord_webhook_url: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  telegram_endpoint_template: ""
  victorops_routing_url: ""
  datadog_api_key: ""
  datadog_endpoint: ""
  new_relic_insert_key: ""
  new_relic_endpoint: ""
  grafana_oncall_webhook_url: ""
  mattermost_webhook_url: ""
  webex_bot_token: ""
  webex_room_id: ""
  webex_endpoint: ""
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_from_number: ""
  twilio_endpoint_template: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_from_email: ""
  service_owners_file: "config/service_owners.yaml"
