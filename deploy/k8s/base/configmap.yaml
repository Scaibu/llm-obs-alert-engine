  REDIS_URL: "redis://redis.llmobs.internal:6379/0"
  POSTGRES_HOST: "alloydb.llmobs.internal"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ewma_db"
  SLACK_WEBHOOK_URL: ""
