  PAGERDUTY_ROUTING_KEY: ""
  PAGERDUTY_ENDPOINT: ""
  PAGERDUTY_TIMEOUT_SECONDS: "5.0"
  TEAMS_WEBHOOK_URL: ""
  OPSGENIE_API_KEY: ""
  OPSGENIE_ENDPOINT: ""
  GENERIC_WEBHOOK_URL: ""
  DISCORD_WEBHOOK_URL: ""
  TELEGRAM_BOT_TOKEN: ""
