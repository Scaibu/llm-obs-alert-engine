  VICTOROPS_ROUTING_URL: ""
  DATADOG_API_KEY: ""
  DATADOG_ENDPOINT: ""
  NEW_RELIC_INSERT_KEY: ""
  NEW_RELIC_ENDPOINT: ""
  GRAFANA_ONCALL_WEBHOOK_URL: ""
  MATTERMOST_WEBHOOK_URL: ""
  WEBEX_BOT_TOKEN: ""
  WEBEX_ROOM_ID: ""
  WEBEX_ENDPOINT: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
  TWILIO_ENDPOINT_TEMPLATE: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: ""
  SERVICE_OWNERS_FILE_PATH: "config/service_owners.yaml"
