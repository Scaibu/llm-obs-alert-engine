apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-engine-config
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: llm-obs
data:
  APP_ENV: "production"
  HEALTH_CHECK_PORT: "8001"
  PROMETHEUS_METRICS_PORT: "9464"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.llmobs.internal:9092"
  KAFKA_CONSUMER_GROUP: "alert-engine-group"
