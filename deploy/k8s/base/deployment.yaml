apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-engine
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: llm-obs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-engine
    spec:
      containers:
        - name: alert-engine
          image: ghcr.io/scaibu/alert-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alert-engine-config
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
