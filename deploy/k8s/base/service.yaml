apiVersion: v1
kind: Service
metadata:
  name: alert-engine
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: llm-obs
spec:
  type: ClusterIP
  ports:
    - name: health
      port: 8001
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: alert-engine
