apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alert-engine-hpa
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: llm-obs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alert-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
