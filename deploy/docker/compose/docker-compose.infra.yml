version: "3.9"

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: alert-engine-kafka
    ports:
      - "9099:9099"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9099'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9099'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - llmobs-network

  redis:
    image: redis:7-alpine
    container_name: alert-engine-redis
    ports:
      - "6389:6379"
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydbomni:15
    container_name: alert-engine-alloydb
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: ewma_db
    ports:
      - "5439:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewma_db"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  llmobs-network:
    name: llmobs-network
