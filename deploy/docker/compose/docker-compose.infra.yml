version: "3.9"

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: llmobs-kafka
    restart: unless-stopped
    ports:
      - "31414:9092"
      - "9099:9099"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://llmobs-kafka:9092,PLAINTEXT_HOST://localhost:9099'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@llmobs-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9099'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - llmobs_kafka_data:/tmp/kraft-combined-logs
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llmobs-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "llmobs_redis_s3cret_2024", "--appendonly", "yes"]
    ports:
      - "31413:6379"
    volumes:
      - llmobs_redis_data:/data
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "llmobs_redis_s3cret_2024", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  alloydb:
    image: google/alloydbomni:15
    container_name: alert-engine-alloydb
    restart: unless-stopped
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: ewma_db
    ports:
      - "${PORT_ALERT_ALLOYDB:-31426}:5432"
    volumes:
      - alert_engine_alloydb_data:/var/lib/postgresql/data
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewma_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  llmobs_kafka_data:
    name: llmobs_kafka_data
  llmobs_redis_data:
    name: llmobs_redis_data
  alert_engine_alloydb_data:
    name: alert_engine_alloydb_data

networks:
  llmobs-network:
    name: llmobs-network
