version: "3.9"

services:
  alert-engine:
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile
    container_name: alert-engine
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      KAFKA_CONSUMER_GROUP: alert-engine-group
      KAFKA_TOPICS: alerts.budget,alerts.cost.anomaly,llm.toxicity.flagged,alerts.quality.degradation,alerts.latency.slo,alerts.latency.ttft_regression
      REDIS_URL: ${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      POSTGRES_HOST: ${POSTGRES_HOST:-alert-engine-alloydb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ewma_db}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_TIMEOUT_SECONDS: ${SLACK_TIMEOUT_SECONDS:-5.0}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY}
      PAGERDUTY_ENDPOINT: ${PAGERDUTY_ENDPOINT}
      PAGERDUTY_TIMEOUT_SECONDS: ${PAGERDUTY_TIMEOUT_SECONDS:-5.0}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      OPSGENIE_API_KEY: ${OPSGENIE_API_KEY}
      OPSGENIE_ENDPOINT: ${OPSGENIE_ENDPOINT}
      GENERIC_WEBHOOK_URL: ${GENERIC_WEBHOOK_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ENDPOINT_TEMPLATE: ${TELEGRAM_ENDPOINT_TEMPLATE}
      VICTOROPS_ROUTING_URL: ${VICTOROPS_ROUTING_URL}
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      DATADOG_ENDPOINT: ${DATADOG_ENDPOINT}
      NEW_RELIC_INSERT_KEY: ${NEW_RELIC_INSERT_KEY}
      NEW_RELIC_ENDPOINT: ${NEW_RELIC_ENDPOINT}
      GRAFANA_ONCALL_WEBHOOK_URL: ${GRAFANA_ONCALL_WEBHOOK_URL}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL}
      WEBEX_BOT_TOKEN: ${WEBEX_BOT_TOKEN}
      WEBEX_ROOM_ID: ${WEBEX_ROOM_ID}
      WEBEX_ENDPOINT: ${WEBEX_ENDPOINT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      TWILIO_ENDPOINT_TEMPLATE: ${TWILIO_ENDPOINT_TEMPLATE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SERVICE_OWNERS_FILE_PATH: ${SERVICE_OWNERS_FILE_PATH:-config/service_owners.yaml}
      PROMETHEUS_METRICS_PORT: 9464
      HEALTH_CHECK_PORT: 8001
    ports:
      - "8001:8001"
      - "9464:9464"
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydbomni:15
    container_name: alert-engine-alloydb
    restart: unless-stopped
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: ewma_db
    ports:
      - "${PORT_ALERT_ALLOYDB:-31426}:5432"
    volumes:
      - alert_engine_alloydb_data:/var/lib/postgresql/data
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewma_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  alert_engine_alloydb_data:
    name: alert_engine_alloydb_data

networks:
  llmobs-network:
    name: llmobs-network
