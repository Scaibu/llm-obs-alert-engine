replicaCount: 2

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

env:
  APP_ENV: "staging"
  HEALTH_CHECK_PORT: "8001"
  PROMETHEUS_METRICS_PORT: "9464"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-staging.llmobs.internal:9092"
  KAFKA_CONSUMER_GROUP: "alert-engine-staging-group"
  KAFKA_TOPICS: "alerts.budget,alerts.cost.anomaly,llm.toxicity.flagged,alerts.quality.degradation,alerts.latency.slo,alerts.latency.ttft_regression"
  REDIS_URL: "redis://redis-staging.llmobs.internal:6379/0"
  POSTGRES_HOST: "alloydb-staging.llmobs.internal"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ewma_db"
  SLACK_WEBHOOK_URL: "http://slack-sink-staging.llmobs.internal:8080/mock-slack"
  PAGERDUTY_ROUTING_KEY: "mock-pagerduty-routing-key"
  SERVICE_OWNERS_FILE_PATH: "config/service_owners.yaml"
