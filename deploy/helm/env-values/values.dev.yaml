replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  APP_ENV: "development"
  HEALTH_CHECK_PORT: "8001"
  PROMETHEUS_METRICS_PORT: "9464"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-dev.llmobs.internal:9092"
  KAFKA_CONSUMER_GROUP: "alert-engine-dev-group"
  KAFKA_TOPICS: "alerts.budget,alerts.cost.anomaly,llm.toxicity.flagged,alerts.quality.degradation,alerts.latency.slo,alerts.latency.ttft_regression"
  REDIS_URL: "redis://redis-dev.llmobs.internal:6379/0"
  POSTGRES_HOST: "alloydb-dev.llmobs.internal"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ewma_db"
  SLACK_WEBHOOK_URL: "http://slack-sink-dev.llmobs.internal:8080/mock-slack"
  PAGERDUTY_ROUTING_KEY: "mock-pagerduty-routing-key"
  SERVICE_OWNERS_FILE_PATH: "config/service_owners.yaml"
