replicaCount: 2

image:
  repository: ghcr.io/scaibu/alert-engine
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  healthPort: 8001
  metricsPort: 9464

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: alert-engine.llmobs.internal
      paths:
        - path: /health
          pathType: Prefix
          port: 8001
        - path: /metrics
          pathType: Prefix
          port: 9464

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  APP_ENV: "production"
  HEALTH_CHECK_PORT: "8001"
  PROMETHEUS_METRICS_PORT: "9464"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.llmobs.internal:9092"
  KAFKA_CONSUMER_GROUP: "alert-engine-group"
  KAFKA_TOPICS: "alerts.budget,alerts.cost.anomaly,llm.toxicity.flagged,alerts.quality.degradation,alerts.latency.slo,alerts.latency.ttft_regression"
  REDIS_URL: "redis://redis.llmobs.internal:6379/0"
  POSTGRES_HOST: "alloydb.llmobs.internal"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ewma_db"
  SLACK_WEBHOOK_URL: "http://slack-sink.llmobs.internal:8080/mock-slack"
  PAGERDUTY_ROUTING_KEY: "mock-pagerduty-routing-key"
  SERVICE_OWNERS_FILE_PATH: "config/service_owners.yaml"
