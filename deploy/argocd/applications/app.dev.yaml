apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-engine-dev
  namespace: argocd
spec:
  project: alert-engine
  source:
    repoURL: https://github.com/scaibu/llm-obs-python-packages
    targetRevision: main
    path: alert-engine/deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: llmobs-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
