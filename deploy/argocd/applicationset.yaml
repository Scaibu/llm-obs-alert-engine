apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alert-engine-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: https://kubernetes.default.svc
          - env: staging
            cluster: https://kubernetes.default.svc
          - env: prod
            cluster: https://kubernetes.default.svc
  template:
    metadata:
      name: 'alert-engine-{{env}}'
    spec:
      project: alert-engine
      source:
        repoURL: https://github.com/scaibu/llm-obs-python-packages
        targetRevision: main
        path: 'alert-engine/deploy/k8s/overlays/{{env}}'
      destination:
        server: '{{cluster}}'
        namespace: 'llmobs-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
